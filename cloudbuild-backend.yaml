steps:
  # Build the Docker image from monorepo root using the backend Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/backend/Dockerfile'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mera-backend:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mera-backend:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/mera-backend:$BUILD_ID'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mera-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/mera-backend:$BUILD_ID'
      - '--region'
      - 'europe-west3'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/mera-backend:latest'
